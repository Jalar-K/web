<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d22">
<title>Your turn</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0b0d22;--surface:#15183a;--surface-2:rgba(255,255,255,.05);--text:#f5f3ff;--muted:#c9c5e3;
  --border:rgba(255,255,255,.14);--border-strong:rgba(255,255,255,.32);--btn-bg:#ede9fe;--btn-ink:#15123a;
  --sel:#c4b5fd;--sel-bg:rgba(196,181,253,.14);--ok:#86efac;--bad:#fca5a5}
@media (prefers-color-scheme:light){
  :root{--bg:#f4f5f9;--surface:#ffffff;--surface-2:rgba(15,23,42,.035);--text:#111827;--muted:#4b5563;
    --border:rgba(15,23,42,.12);--border-strong:rgba(15,23,42,.3);--btn-bg:#1f2937;--btn-ink:#fff;
    --sel:#5b21b6;--sel-bg:rgba(91,33,182,.08);--ok:#15803d;--bad:#b91c1c}
}
body{background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;min-height:100vh}
main{max-width:460px;margin:0 auto;padding:40px 18px 48px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:22px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
h1{font-family:Georgia,serif;font-weight:400;font-size:26px;line-height:1.3;margin:8px 0 8px}
p.sub{color:var(--muted)}
.hud{display:flex;justify-content:space-between;font-size:14px;font-weight:600;color:var(--muted);margin-bottom:10px}
.bar{height:4px;border-radius:999px;background:var(--surface-2);overflow:hidden;margin-bottom:20px}
.bar i{display:block;height:100%;width:0;background:var(--sel);transition:width .35s ease}
.q{font-family:Georgia,serif;font-size:21px;line-height:1.4;margin-bottom:18px}
.opts{display:grid;gap:8px}
.opt{text-align:left;padding:13px 15px;border-radius:14px;cursor:pointer;font:inherit;font-size:15px;color:var(--text);
  border:1px solid var(--border-strong);background:var(--surface-2);transition:border-color .2s,background .2s}
.opt:hover{border-color:var(--text)}
.opt.on{border-color:var(--sel);background:var(--sel-bg);font-weight:600}
button.primary{margin-top:18px;width:100%;padding:13px 16px;border-radius:999px;border:none;cursor:pointer;
  background:var(--btn-bg);color:var(--btn-ink);font:inherit;font-weight:600;transition:opacity .2s,transform .15s}
button.primary:disabled{opacity:.45;cursor:default}
button.primary:active{transform:scale(.985)}
.link{background:none;border:none;color:var(--muted);font:inherit;font-size:14px;text-decoration:underline;
  text-underline-offset:3px;cursor:pointer;margin-top:14px;transition:color .2s}
.link:hover{color:var(--text)}
.big{font-size:48px;font-weight:700;letter-spacing:-.02em;line-height:1.05;margin:8px 0 4px}
.big small{font-size:20px;color:var(--muted);font-weight:600}
.rv{border-top:1px solid var(--border);padding:12px 0}
.rv b{display:block;font-size:15px;margin-bottom:3px}
.rv span{display:block;font-size:14px;color:var(--muted)}
.rv .y{color:var(--ok);font-weight:600}
.rv .n{color:var(--bad);font-weight:600}
.center{text-align:center}
</style>
</head>
<body>
<main id="app"><div class="card"><p class="sub">Loading…</p></div></main>
<script>
/* your Vercel server URL — same as in index.html */
const API = "https://web-server-rose.vercel.app".replace(/\/+$/, '');

const $ = s => document.querySelector(s);
const app = $('#app');
const id = new URLSearchParams(location.search).get('q');
function el(tag, cls, text){ const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function card(){ app.innerHTML = ''; const c = el('div', 'card'); app.appendChild(c); return c; }
function fail(msg){ const c = card(); c.appendChild(el('p', 'eyebrow', 'Hmm')); c.appendChild(el('h1', '', msg)); }

let Q = [], answers = [], i = 0, t0 = 0;

async function boot(){
  if (!id) return fail('This link is missing its quiz.');
  try {
    const r = await fetch(API + '/api/herquiz?id=' + encodeURIComponent(id));
    if (r.status === 404) return fail("This quiz doesn't exist any more.");
    const j = await r.json();
    Q = j.questions || [];
    if (!Q.length) return fail('This quiz has no questions yet.');
  } catch(e){ return fail("Couldn't load the quiz. Check your connection and refresh."); }
  intro();
}

function intro(){
  const c = card();
  c.appendChild(el('p', 'eyebrow', 'Your turn'));
  c.appendChild(el('h1', '', 'How well do you know her?'));
  c.appendChild(el('p', 'sub', Q.length + ' question' + (Q.length === 1 ? '' : 's') + ' she wrote about herself. She gets to see your score.'));
  const go = el('button', 'primary', 'Start');
  go.addEventListener('click', () => { answers = []; i = 0; t0 = Date.now(); ask(); });
  c.appendChild(go);
}

function ask(){
  const it = Q[i], c = card();
  const hud = el('div', 'hud'); hud.append(el('span', '', 'Question ' + (i+1)), el('span', '', (i+1) + ' / ' + Q.length));
  const bar = el('div', 'bar'); const fill = el('i'); bar.appendChild(fill);
  c.append(hud, bar, el('p', 'q', it.q));
  requestAnimationFrame(() => fill.style.width = (i / Q.length * 100) + '%');
  const opts = el('div', 'opts');
  const next = el('button', 'primary', i === Q.length - 1 ? 'Finish' : 'Next');
  next.disabled = answers[i] == null;
  it.a.forEach((txt, n) => {
    const b = el('button', 'opt' + (answers[i] === n ? ' on' : ''), txt);
    b.addEventListener('click', () => {
      answers[i] = n;
      opts.querySelectorAll('.opt').forEach((o, m) => o.classList.toggle('on', m === n));
      next.disabled = false;
    });
    opts.appendChild(b);
  });
  next.addEventListener('click', () => { if (++i >= Q.length) submit(); else ask(); });
  c.append(opts, next);
  if (i > 0){
    const back = el('button', 'link', 'Back');
    back.addEventListener('click', () => { i--; ask(); });
    c.appendChild(back);
  }
}

async function submit(){
  const c = card();
  c.appendChild(el('p', 'sub', 'Marking…'));
  let j;
  try {
    const r = await fetch(API + '/api/herquiz-answer', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ quiz_id: id, answers, duration_ms: Date.now() - t0 })
    });
    j = await r.json();
    if (!r.ok) throw new Error(j.error || 'failed');
  } catch(e){
    c.innerHTML = '';
    c.appendChild(el('h1', '', "Couldn't send your answers."));
    const again = el('button', 'primary', 'Try again'); again.addEventListener('click', submit);
    return c.appendChild(again);
  }
  result(j);
}

function result(j){
  const c = card(), r = j.total ? j.score / j.total : 0;
  c.appendChild(el('p', 'eyebrow', 'Your score'));
  const big = el('p', 'big', j.score + ' '); big.appendChild(el('small', '', '/ ' + j.total)); c.appendChild(big);
  c.appendChild(el('p', 'sub', (r === 1 ? 'You know her completely.' : r >= .75 ? 'You know her well.' :
    r >= .5 ? 'Not bad — keep paying attention.' : 'Time to ask more questions.') + ' She can see this now.'));
  const list = el('div'); list.style.marginTop = '16px';
  j.review.forEach(rv => {
    const row = el('div', 'rv');
    row.appendChild(el('b', '', rv.q));
    row.appendChild(el('span', rv.right ? 'y' : 'n', (rv.right ? '✓ ' : '✕ ') + 'You said: ' + (rv.pick != null ? rv.a[rv.pick] : 'No answer')));
    if (!rv.right) row.appendChild(el('span', '', 'Right answer: ' + rv.a[rv.c]));
    list.appendChild(row);
  });
  c.appendChild(list);
  const again = el('button', 'link', 'Take it again');
  again.addEventListener('click', intro);
  c.appendChild(again);
}

boot();
</script>
</body>
</html>
